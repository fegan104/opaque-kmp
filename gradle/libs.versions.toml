[versions]
agp = "9.5.2"
android-compileSdk = "37"
android-minSdk = "24"
kotlin = "2.4.10"
vanniktech-maven-publish = "0.36.0"
androidx-test-runner = "1.6.2"
androidx-test-ext-junit = "1.2.1"
oxikt = "1.4.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
oxikt-runtime-jvm = { module = "dev.oxikt:runtime-jvm", version.ref = "oxikt" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }
oxikt = { id = "dev.oxikt.gradle.plugin", version.ref = "oxikt" }