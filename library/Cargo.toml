[package]
name = "opaquekmp"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "opaquekmp"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
uniffi = "0.32.0"
opaque-ke = { version = "4.0", features = ["argon2"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
